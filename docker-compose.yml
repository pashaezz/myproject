services:
  whoami:
    image: traefik/whoami:v1.11
    networks:
      - backend
  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - whoami
    ports:
      - "1010:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
      - frontend
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    depends_on:
      - nginx
    command:
      - -nginx.scrape-uri=http://nginx:8080/nginx_status
    networks:
      - backend
  node-exporter:
    image: prom/node-exporter:latest
    networks:
      - backend
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - node-exporter
      - nginx-exporter
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PAASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - backend
    ports:
      - "3000:3000"
networks:
  frontend:
  backend:
volumes:
  prometheus_data:
  grafana_data:
