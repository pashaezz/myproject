# Публичный вход: проксируем на whoami
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://whoami:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Внутренний статус для экспортёра метрик Nginx
server {
    listen 8080;
    server_name _;

    location /nginx_status {
        stub_status;
        access_log off;

        # Разрешаем доступ только из приватных сетей (docker тоже обычно попадает сюда)
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
